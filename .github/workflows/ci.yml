name: CI Quality Gate

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://ci_user:ci_pass@localhost:5432/aqa_ci"
      DIRECT_URL: "postgresql://ci_user:ci_pass@localhost:5432/aqa_ci"
      NEXTAUTH_SECRET: "ci_test_secret_at_least_32_characters_long_12345"
      NEXTAUTH_URL: "http://localhost:3000"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: Lint check
        run: npm run lint

      - name: Run unit tests
        run: npm test
